<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>キネコ 来年度アプリ更新メモ</title>
<style>
:root{color-scheme:light}
body{margin:0;font-size:14px}
:root{
  --bg:#F5F0DC; --panel:#FFFFFF; --text:#1A1A1A; --sub:#6b6b6b; --line:#1A1A1A;
  --red:#C0392B; --gold:#C9A84C; --soft:#EFE8CB; --ok:#2e7d4f; --warn:#b26a00;
  --shadow:3px 3px 0 var(--line);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a16; --panel:#262420; --text:#f1ecda; --sub:#a9a38f; --line:#f1ecda;
    --red:#ea6a5c; --gold:#d8b95c; --soft:#34312a; --ok:#6cc58f; --warn:#e0a24a;
    --shadow:3px 3px 0 rgba(241,236,218,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1a16; --panel:#262420; --text:#f1ecda; --sub:#a9a38f; --line:#f1ecda;
  --red:#ea6a5c; --gold:#d8b95c; --soft:#34312a; --ok:#6cc58f; --warn:#e0a24a;
  --shadow:3px 3px 0 rgba(241,236,218,.55);
  color-scheme:dark;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.btn.red{color:#fff}
.btn[disabled],.f input[disabled],.f textarea[disabled],.f select[disabled],.noteArea textarea[disabled],.task input[disabled]{opacity:.55;cursor:not-allowed}
.ovl{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;width:min(460px,100%);max-height:86vh;overflow:auto}
.mdl .mmsg{margin:0 0 14px;white-space:pre-wrap}
.mdl .mbtn{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mdl input[type=text],.mdl textarea{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px 9px;margin-bottom:12px}
.mdl textarea{min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.syncnote{background:var(--soft);border:2px solid var(--gold);border-radius:12px;padding:6px 12px;font-size:13px;margin-bottom:12px}
.syncnote.ro{border-color:var(--red)}
.by{margin-top:8px;font-size:12px;color:var(--sub);text-align:right}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;flex:1 1 220px;letter-spacing:.02em}
header.top h1 small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--line);font-weight:600;font-size:13px}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(1px,1px);box-shadow:none}
.btn.red{background:var(--red);color:#fff;border-color:var(--line)}
.btn.small{padding:2px 8px;font-size:12px;box-shadow:1px 1px 0 var(--line)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.ghost:hover{border-color:var(--line)}
#saveState{font-size:12px;color:var(--sub);min-width:150px;text-align:right}
#saveState.err{color:var(--red);font-weight:700}
.layout{display:grid;grid-template-columns:230px 1fr;gap:20px;max-width:1180px;margin:0 auto;padding-block:18px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 96px);overflow:auto;padding:2px 6px 8px 2px}
nav.side button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;width:100%;border:2px solid transparent;background:transparent;border-radius:10px;padding:7px 10px;cursor:pointer}
nav.side button:hover{background:var(--soft)}
nav.side button.on{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow);font-weight:700}
nav.side .cnt{font-size:11px;color:var(--sub);white-space:nowrap}
nav.side .grp{font-size:11px;letter-spacing:.14em;color:var(--sub);margin:10px 10px 2px}
main{min-width:0}
.warn{background:var(--soft);border:2px dashed var(--gold);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:14px}
h2.sec{font-size:22px;margin:0 0 4px;display:flex;gap:10px;align-items:center}
h2.sec::before{content:"";width:5px;height:22px;background:var(--gold);display:inline-block}
p.desc{margin:0 0 12px;color:var(--sub);font-size:13.5px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:0 0 14px}
.pad{padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 12px}
.f{grid-column:span 6;min-width:0}
.f.w2{grid-column:span 3}.f.w3{grid-column:span 2}.f.w4{grid-column:span 4}
label.lab{display:block;font-size:12px;font-weight:700;margin-bottom:2px;color:var(--sub)}
.f input[type=text],.f input[type=url],.f input[type=number],.f input[type=date],.f input[type=time],.f input[type=datetime-local],.f select,.f textarea,.noteArea textarea,.toolbar input[type=search]{
  width:100%;border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;min-height:36px}
.f textarea,.noteArea textarea{resize:vertical;min-height:76px}
.f input:focus,.f select:focus,.f textarea:focus,.noteArea textarea:focus,.toolbar input:focus{outline:3px solid var(--gold);outline-offset:1px}
.chk{display:flex;align-items:center;gap:8px;padding-top:22px}
.chk input{width:18px;height:18px;accent-color:var(--red)}
.hint{font-size:11.5px;color:var(--sub);margin-top:2px}
.noteArea{margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.toolbar input[type=search]{max-width:260px}
.item>.head{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;user-select:none}
.item>.head .no{font-size:12px;color:var(--sub);min-width:26px}
.item>.head .tt{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item>.head .tt.empty{color:var(--sub);font-weight:400}
.item>.head .sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
.badge{font-size:11px;font-weight:700;border:2px solid var(--line);border-radius:99px;padding:0 8px;white-space:nowrap}
.badge.s0{background:var(--soft)}.badge.s1{background:var(--gold);color:#1a1a1a}.badge.s2{background:var(--ok);color:#fff;border-color:var(--ok)}
.item .body{display:none;border-top:2px solid var(--line);padding:14px 16px}
.item.open .body{display:block}
.item .tools{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.chev{transition:transform .15s}.item.open .chev{transform:rotate(90deg)}
.empty-msg{padding:22px;text-align:center;color:var(--sub);border:2px dashed var(--sub);border-radius:14px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:19px;height:19px;margin-top:4px;accent-color:var(--red);flex:none}
.task input[type=text]{width:100%;border:0;border-bottom:2px solid transparent;background:transparent;padding:2px 4px;min-width:0}
.task input[type=text]:focus{outline:0;border-bottom-color:var(--gold)}
.task.done input[type=text]{text-decoration:line-through;color:var(--sub)}
.task .path{font-size:11px;color:var(--sub);display:block;padding-left:4px}
.grptitle{font-weight:700;margin:2px 0 6px;font-size:14px}
.bar{height:10px;border:2px solid var(--line);border-radius:99px;background:var(--bg);overflow:hidden;margin:2px 0 10px}
.bar i{display:block;height:100%;background:var(--red);width:0}
nav.side .cnt.bad{color:var(--red);font-weight:700}
.refs{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.refrow{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:8px;background:var(--bg);padding:3px 8px}
.refrow .no{font-size:12px;color:var(--sub);min-width:20px}
.refrow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refrow .nm.gone{color:var(--red);font-weight:400}
.f select{margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:99px;padding:2px 14px;cursor:pointer;font-weight:600}
.chip.on{background:var(--red);color:#fff}
.chip.odd{border-style:dashed}
.addrow{display:flex;gap:6px;align-items:center}
.addrow input{max-width:140px;border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 8px;min-height:30px}
.derived{margin-top:10px;background:var(--soft);border:2px dashed var(--gold);border-radius:10px;padding:8px 12px;font-size:13px}
.issue{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.issue:last-child{border-bottom:0}
.issue .btn{flex:none;white-space:nowrap}
.menu{position:relative}
.menu .pop{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:250px;z-index:30}
.menu.open .pop{display:block}
.menu .pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer}
.menu .pop button:hover{background:var(--soft)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:.95}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;gap:10px}
  nav.side{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  nav.side button{width:auto;white-space:nowrap}
  nav.side .grp{display:none}
  .f.w2,.f.w3,.f.w4{grid-column:span 6}
  .item>.head .sub{display:none}
}
body.out .actions,body.out nav.side{display:none}
body.out .layout{grid-template-columns:1fr;max-width:520px}
.login{background:var(--panel);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-top:8vh}
.login h2{margin:0 0 4px;font-size:20px}
.login p{margin:0 0 14px;color:var(--sub);font-size:13.5px}
.login label.lab{margin-top:10px}
.login input[type=text],.login input[type=password]{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:8px 10px;min-height:40px;font-size:16px}
.login .rem{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:13px}
.login .err{color:var(--red);font-weight:700;margin-top:10px;min-height:1.4em}
#who{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<header class="top">
  <h1>キネコ 来年度アプリ更新メモ<small>アプリ更新に使う情報を書き留めておく共有メモ。入力は自動で保存され、開いている全員に反映されます。</small></h1>
  <div class="actions">
    <span id="who"></span>
    <span id="saveState"></span>
    <button class="btn ghost small" id="logoutBtn" type="button">ログアウト</button>
    <div class="menu" id="expMenu">
      <button class="btn" id="expBtn" type="button">書き出す ▾</button>
      <div class="pop">
        <button type="button" data-x="json">全体をバックアップ（JSON）</button>
        <button type="button" data-x="md">読みやすい文書（Markdown）</button>
        <button type="button" data-x="csv">いまの表だけ（CSV / Excel用）</button>
      </div>
    </div>
    <button class="btn" id="impBtn" type="button">読み込む</button>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
  </div>
</header>
<div class="layout">
  <nav class="side" id="nav" aria-label="項目"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

// state は共有データベースの内容のコピー。画面の操作はここを書き換え、save() が差分だけをデータベースへ書く。
let state = {v:2, data:{}};
let cur = SECTIONS[0].id;
try { const c = localStorage.getItem("kineko-notes-cur"); if (c && SECTIONS.some(s => s.id === c)) cur = c; } catch(e){}
let filterMode = "all", query = "";
const open = new Set();
const secById = id => SECTIONS.find(s => s.id === id);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

function sec(id){
  const d = state.data;
  if (!d[id]) d[id] = secById(id).type === "form" ? {note:"", values:{}} : {note:"", items:[]};
  return d[id];
}
/* ---- 参照（他の項目から選ぶ）のための道具 ---- */
const items = sid => sec(sid).items || [];
const tfKey = sid => (secById(sid).fields.find(f => f.title) || {}).k;
function titleOf(sid, it){ const k = tfKey(sid); return (k && it[k]) || `（無題 ${items(sid).indexOf(it) + 1}）`; }
const byId = (sid, id) => items(sid).find(i => i.id === id);
const festivalDates = () => String(sec("basic").values.dates || "").split(/[,、，\s]+/).map(x => x.trim()).filter(Boolean);
const dkey = d => { const m = String(d).match(/(\d+)\s*\/\s*(\d+)/); return m ? +m[1] * 100 + +m[2] : 9999; };
const toMin = t => { const m = /^(\d+):(\d+)/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
const minutesOf = it => { const m = String(it.min || "").match(/\d+/); return m ? +m[0] : null; };
const frameOf = s => { const a = toMin(s.start), b = toMin(s.end); return a != null && b != null && b > a ? b - a : null; };
function usedBy(sid, id){
  const out = [];
  for (const s of SECTIONS) { if (!s.fields) continue;
    for (const f of s.fields) if ((f.t === "ref" || f.t === "refs") && f.of === sid) {
      const n = items(s.id).filter(it => f.t === "ref" ? it[f.k] === id : (it[f.k] || []).includes(id)).length;
      if (n) out.push({sec: s.id, n});
    }
  }
  return out;
}
function migrate(){
  const splitDates = v => String(v || "").split(/[,、，・\s]+/).map(x => x.trim()).filter(Boolean);
  const addMemo = (it, t) => { it.memo = (it.memo ? it.memo + "\n" : "") + t; };
  for (const s of SECTIONS) {
    if (!s.fields || s.type !== "list") continue;
    for (const it of items(s.id)) {
      for (const f of s.fields) {
        const v = it[f.k];
        if (f.t === "ref" && typeof v === "string" && v) {
          const hit = items(f.of).find(x => titleOf(f.of, x) === v.trim());
          if (hit) it[f.k] = hit.id; else { addMemo(it, `（旧入力　${f.l}：${v}）`); it[f.k] = ""; }
        } else if (f.t === "refs" && typeof v === "string") {
          const ids = [];
          v.split("\n").map(x => x.trim()).filter(Boolean).forEach(line => { const hit = items(f.of).find(x => titleOf(f.of, x) === line); if (hit) ids.push(hit.id); else addMemo(it, `（旧入力　${f.l}：${line}）`); });
          it[f.k] = ids;
        } else if (f.t === "dates" && typeof v === "string") it[f.k] = splitDates(v);
      }
      if (s.id === "awards" && it.dc) { addMemo(it, `（旧入力　監督・国・上映時間：${it.dc}）`); delete it.dc; }
    }
  }
}
/* ============ 共有データベースとの同期 ============
   データベースの構成（1件＝1ドキュメント。他の人と同時に編集しても、別の項目なら競合しない）
     sec/<項目ID>        … その項目のメモ。「基本情報」「チケット」は入力値(values)もここ
     sec/_meta           … 初期の「やること」を入れたかどうかの印
     rec/<項目ID>.<ID>   … 一覧の1件（会場1つ、作品1つ、…）。s=項目ID、ord=並び順
   画面の操作は state を直接書き換え、save() が「最後に同期した内容(shadow)」との差分だけを書く。
   他の人の変更は onSnapshot で受け取り、自分がまだ保存していない入力欄は上書きしない。 */
let db = null, myName = "", ro = false, ready = false;
const shadow = {sec:{}, rec:{}};
let meta = {};
const got = {sec:false, rec:false}, fresh = {sec:false, rec:false};
let seedChecked = false, pendingRender = false, flushTimer = null, lastWriteOk = true;

const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const emp = v => v === undefined || v === null || v === "" || v === false || (Array.isArray(v) && !v.length);
const same = (a, b) => (emp(a) && emp(b)) || eq(a, b);
const renum = sid => items(sid).forEach((it, i) => { it.ord = i; });
function sortItems(sid){ items(sid).sort((a, b) => ((a.ord ?? 1e9) - (b.ord ?? 1e9)) || (a.id < b.id ? -1 : 1)); }
function recData(sid, it){ const o = {}; for (const k in it) if (k !== "id" && k[0] !== "_" && it[k] !== undefined) o[k] = it[k]; o.s = sid; return o; }

function setSaveState(t, err){ const e = document.getElementById("saveState"); e.textContent = t; e.className = err ? "err" : ""; }
const clock = () => new Date().toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit"});
function markSaved(){ if (lastWriteOk) setSaveState("保存しました " + clock()); }
function save(){
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 400);
  if (ro) setSaveState("閲覧のみ（保存されません）", true); else setSaveState("保存中…");
}

/* 差分を作る：shadow(最後に同期した内容)と比べ、変わった所だけ */
function diffDoc(path, local, store, key, create, stamp){
  const sh = store[key], full = Object.assign(clone(local), stamp);
  if (!sh) {
    const has = create || Object.keys(local).some(k => k === "values" ? Object.keys(local.values || {}).some(x => !emp(local.values[x])) : !emp(local[k]));
    if (!has) return null;
    store[key] = clone(local);
    return {path, kind:"set", data:full, undo: () => { delete store[key]; }};
  }
  const patch = {};
  for (const k of Object.keys(local)) {
    if (local[k] === undefined) continue;
    if (k === "values") {
      const vu = {};
      for (const x of Object.keys(local.values || {})) if (local.values[x] !== undefined && !same(local.values[x], (sh.values || {})[x])) vu[x] = clone(local.values[x]);
      if (Object.keys(vu).length) patch.values = vu;
    } else if (!same(local[k], sh[k])) patch[k] = clone(local[k]);
  }
  if (!Object.keys(patch).length) return null;
  store[key] = clone(local);
  return {path, kind:"update", patch:Object.assign(patch, stamp), data:full, undo: () => { store[key] = sh; }};
}
function flush(){
  clearTimeout(flushTimer);
  if (!ready || !db || ro) return;
  const now = Date.now(), stamp = {_by:myName, _at:now}, ops = [];
  for (const s of SECTIONS) {
    if (s.type === "check") continue;
    const d = state.data[s.id]; if (!d) continue;
    const local = s.type === "form" ? {note:d.note || "", values:d.values || {}} : {note:d.note || ""};
    const op = diffDoc("sec/" + s.id, local, shadow.sec, s.id, false, stamp);
    if (op) { d._by = myName; d._at = now; ops.push(op); }
    if (s.type === "form") continue;
    renum(s.id);
    const ids = new Set();
    for (const it of d.items) {
      const did = s.id + "." + it.id; ids.add(did);
      const o = diffDoc("rec/" + did, recData(s.id, it), shadow.rec, did, true, stamp);
      if (o) { it._by = myName; it._at = now; ops.push(o); }
    }
    for (const did of Object.keys(shadow.rec)) if (did.startsWith(s.id + ".") && !ids.has(did)) {
      const prev = shadow.rec[did]; delete shadow.rec[did];
      ops.push({path:"rec/" + did, kind:"delete", undo: () => { shadow.rec[did] = prev; }});
    }
  }
  if (!ops.length) { markSaved(); return; }
  setSaveState("保存中…");
  ops.forEach(op => enqueue(op));
}
/* 書き込み：同じドキュメントへは1つずつ順に、全体でも同時に6件まで */
const chains = new Map(); let running = 0; const waiting = [];
function limited(fn){ return new Promise(res => { const go = () => { running++; fn().finally(() => { running--; res(); if (waiting.length) waiting.shift()(); }); }; running < 6 ? go() : waiting.push(go); }); }
function enqueue(op){
  const prev = chains.get(op.path) || Promise.resolve();
  const next = prev.then(() => limited(() => exec(op)));
  chains.set(op.path, next);
  next.then(() => { if (chains.get(op.path) === next) chains.delete(op.path); });
}
async function exec(op, retried){
  const ref = db.doc(op.path);
  try {
    if (op.kind === "delete") await ref.delete();
    else if (op.kind === "set") await ref.set(op.data);
    else { try { await ref.update(op.patch); } catch (e) { if (e && e.code === "invalid_argument") await ref.set(op.data); else throw e; } }
    lastWriteOk = true; markSaved();
  } catch (e) {
    const code = e && e.code;
    if (code === "unavailable" && !retried) { await new Promise(r => setTimeout(r, 800 + Math.random() * 600)); return exec(op, true); }
    if (code === "invalid_argument" || code === "revoked") { setReadOnly(); return; }
    op.undo && op.undo();
    lastWriteOk = false;
    setSaveState(code === "quota_exceeded" ? "保存の上限に達しました" : "保存できませんでした。しばらくして、もう一度操作してください", true);
  }
}
function setReadOnly(){
  if (ro) return; ro = true;
  setSaveState("閲覧のみ（保存されません）", true);
  render();
}

/* 他の人の変更を、自分の入力を壊さずに取り込む */
function mergeInto(local, shOld, remote){
  let chg = false; shOld = shOld || {};
  for (const k of Object.keys(remote)) {
    if (k === "id" || k === "s") continue;
    if (k[0] === "_") { local[k] = remote[k]; continue; }
    if (k === "values" && remote.values && typeof remote.values === "object") {
      local.values = local.values || {};
      if (mergeInto(local.values, shOld.values, remote.values)) chg = true;
      continue;
    }
    if (!same(local[k], shOld[k])) continue;           // 自分が、まだ保存していない入力
    if (!same(local[k], remote[k])) { local[k] = clone(remote[k]); chg = true; }
  }
  return chg;
}
function applySec(snap){
  let chg = false;
  for (const ch of snap.docChanges()) {
    const id = ch.doc.id;
    if (id === "_meta") { meta = ch.type === "removed" ? {} : (clone(ch.doc.data()) || {}); continue; }
    const s = secById(id); if (!s || s.type === "check") continue;
    if (ch.type === "removed") { delete shadow.sec[id]; continue; }
    const data = clone(ch.doc.data()) || {};
    if (mergeInto(sec(id), shadow.sec[id], data)) chg = true;
    shadow.sec[id] = data;
  }
  return chg;
}
function applyRec(snap){
  let chg = false; const touched = new Set();
  for (const ch of snap.docChanges()) {
    const did = ch.doc.id, dot = did.indexOf("."); if (dot < 0) continue;
    const sid = did.slice(0, dot), iid = did.slice(dot + 1), s = secById(sid);
    if (!s || s.type === "form" || s.type === "check") continue;
    const arr = sec(sid).items, idx = arr.findIndex(x => x.id === iid);
    if (ch.type === "removed") { delete shadow.rec[did]; if (idx >= 0) { arr.splice(idx, 1); chg = true; } continue; }
    const data = clone(ch.doc.data()) || {};
    if (idx < 0) { const it = Object.assign({id:iid}, data); delete it.s; arr.push(it); chg = true; touched.add(sid); }
    else if (mergeInto(arr[idx], shadow.rec[did], data)) { chg = true; touched.add(sid); }
    shadow.rec[did] = data;
  }
  touched.forEach(sortItems);
  return chg;
}
function onSnap(kind, snap){
  const chg = kind === "sec" ? applySec(snap) : applyRec(snap);
  got[kind] = true; if (!snap.metadata.fromCache) fresh[kind] = true;
  if (!ready) { if (got.sec && got.rec) { ready = true; render(); } }
  else if (chg) remoteChanged();
  maybeSeed();
  if (ready && fresh.sec && fresh.rec && lastWriteOk && !flushTimer) setSaveState("同期済み " + clock());
}
function editing(){
  const a = document.activeElement;
  return !!(a && a.closest && a.closest("main") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !a.closest(".toolbar"));
}
function remoteChanged(){
  if (editing()) { pendingRender = true; const n = document.getElementById("syncnote"); if (n) n.hidden = false; return; }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
document.addEventListener("focusout", () => {
  if (!pendingRender) return;
  setTimeout(() => { if (editing()) return; pendingRender = false; const y = window.scrollY; render(); window.scrollTo(0, y); }, 150);
});
/* 最初に開いた人が、初期の「やること」を入れる（2人が同時に開いても、同じIDなので重複しない） */
function maybeSeed(){
  if (seedChecked || !ready || !fresh.sec || !fresh.rec || ro) return;
  seedChecked = true;
  if (meta.seeded) return;
  if (!items("tasks").length) {
    const t = sec("tasks"); t.items = DEFAULT_TASKS.map(([g, x, p], i) => ({id:"d" + String(i + 1).padStart(2, "0"), g, text:x, path:p, done:false, ord:i}));
    flush();
  }
  meta.seeded = true;
  db.doc("sec/_meta").set({seeded:true}).catch(() => {});
}
function storeCur(){ try { localStorage.setItem("kineko-notes-cur", cur); } catch(e){} }

/* ============ ページ内のダイアログ（公開ページでは confirm / prompt / alert が使えない） ============ */
function modal(build){
  const ov = h("div", {class:"ovl"}), box = h("div", {class:"mdl", role:"dialog", "aria-modal":"true"});
  ov.append(box); build(box, () => ov.remove()); document.body.append(ov);
  const f = box.querySelector("input,textarea,button"); if (f) f.focus();
}
function ask(msg, ok, danger){
  return new Promise(res => modal((box, close) => {
    box.append(h("p", {class:"mmsg"}, msg), h("div", {class:"mbtn"},
      h("button", {class:"btn", type:"button", onclick: () => { close(); res(false); }}, "キャンセル"),
      h("button", {class:"btn" + (danger ? " red" : ""), type:"button", onclick: () => { close(); res(true); }}, ok || "OK")));
  }));
}
function askText(msg){
  return new Promise(res => modal((box, close) => {
    const inp = h("input", {type:"text", "aria-label":msg});
    const done = v => { close(); res(v); };
    inp.onkeydown = e => { if (e.key === "Enter") done(inp.value.trim() || null); };
    box.append(h("p", {class:"mmsg"}, msg), inp, h("div", {class:"mbtn"},
      h("button", {class:"btn", type:"button", onclick: () => done(null)}, "キャンセル"),
      h("button", {class:"btn red", type:"button", onclick: () => done(inp.value.trim() || null)}, "追加")));
  }));
}
function showText(title, text){
  modal((box, close) => {
    const ta = h("textarea", {readonly:true, value:text, "aria-label":title});
    box.append(h("p", {class:"mmsg"}, title + "\n保存機能が使えないため、内容をコピーして、メモ帳などに貼り付けてください。"), ta, h("div", {class:"mbtn"},
      h("button", {class:"btn", type:"button", onclick: () => { ta.select(); try { navigator.clipboard.writeText(text).then(() => toast("コピーしました"), () => toast("選択しました。コピーしてください")); } catch(e){ toast("選択しました。コピーしてください"); } }}, "コピー"),
      h("button", {class:"btn red", type:"button", onclick: close}, "閉じる")));
  });
}

/* ============ DOM ヘルパー ============ */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (k === "checked") e.checked = !!v;
    else if (k === "selected") e.selected = !!v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function toast(t){ const e = document.getElementById("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 1800); }

/* ============ 入力欄 ============ */
function fieldEl(f, obj, onChange){
  const id = "f-" + uid();
  const set = v => { obj[f.k] = v; onChange && onChange(f); save(); };
  if (f.t === "refs") return refsEl(f, obj, onChange);
  if (f.t === "dates") return datesEl(f, obj, onChange);
  let input, extra = null;
  if (f.t === "area") input = h("textarea", {id, value: obj[f.k] || "", placeholder: f.ph || "", oninput: e => set(e.target.value)});
  else if (f.t === "select") {
    input = h("select", {id, onchange: e => set(e.target.value)}, h("option", {value:""}, "（未選択）"), f.o.map(o => h("option", {value:o}, o)));
    input.value = obj[f.k] || "";
  }
  else if (f.t === "ref") {
    const list = items(f.of), tt = secById(f.of).title;
    input = h("select", {id, onchange: e => set(e.target.value)},
      h("option", {value:""}, list.length ? "（選んでください）" : `（先に「${tt}」を登録してください）`),
      list.map(x => h("option", {value:x.id}, titleOf(f.of, x))));
    if (obj[f.k] && !byId(f.of, obj[f.k])) input.append(h("option", {value:obj[f.k]}, "（削除された項目）"));
    input.value = obj[f.k] || "";
    extra = h("button", {class:"btn ghost small jump", type:"button", onclick: () => go(f.of)}, `「${tt}」を開く →`);
  }
  else if (f.t === "check") {
    const cb =h("input", {type:"checkbox", id, checked: !!obj[f.k], onchange: e => set(e.target.checked)});
    return h("div", {class:"f chk " + (f.w || "")}, cb, h("label", {for:id}, f.l));
  }
  else input = h("input", {id, type: f.t, value: obj[f.k] ?? "", placeholder: f.ph || "", inputmode: f.t === "number" ? "numeric" : null, oninput: e => set(e.target.value)});
  return h("div", {class:"f " + (f.w || "")}, h("label", {class:"lab", for:id}, f.l), input, extra, f.hint ? h("div", {class:"hint"}, f.hint) : null);
}

/* 登録済みの項目を、順番つきで複数選ぶ（例：上映回の収録作品） */
function refsEl(f, obj, onChange){
  const id = "f-" + uid(), tt = secById(f.of).title;
  const box = h("div", {class:"refs"}), pick = h("select", {id}), wrap = h("div", {class:"f " + (f.w || "")});
  const ids = () => (obj[f.k] = Array.isArray(obj[f.k]) ? obj[f.k] : []);
  const changed = () => { onChange && onChange(f); save(); draw(); };
  const swap = (i, j) => { const a = ids(); if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; changed(); };
  function draw(){
    box.textContent = "";
    ids().forEach((rid, i) => {
      const t = byId(f.of, rid);
      box.append(h("div", {class:"refrow"}, h("span", {class:"no"}, String(i + 1)),
        h("span", {class:"nm" + (t ? "" : " gone")}, t ? titleOf(f.of, t) + (t.min ? `（${t.min}）` : "") : "（削除された項目）"),
        h("button", {class:"btn small", type:"button", "aria-label":"上へ", onclick: () => swap(i, i - 1)}, "↑"),
        h("button", {class:"btn small", type:"button", "aria-label":"下へ", onclick: () => swap(i, i + 1)}, "↓"),
        h("button", {class:"btn small", type:"button", "aria-label":"外す", onclick: () => { ids().splice(i, 1); changed(); }}, "外す")));
    });
    if (!ids().length) box.append(h("div", {class:"hint"}, "まだ選ばれていません"));
    const all = items(f.of), rest = all.filter(x => !ids().includes(x.id));
    pick.textContent = "";
    pick.append(h("option", {value:""}, !all.length ? `（先に「${tt}」を登録してください）` : rest.length ? `＋ 「${tt}」から追加する…` : `（登録済みの${tt}は、すべて選ばれています）`),
      ...rest.map(x => h("option", {value:x.id}, titleOf(f.of, x))));
  }
  pick.onchange = () => { if (pick.value) { ids().push(pick.value); changed(); } };
  draw();
  wrap.append(h("label", {class:"lab", for:id}, f.l), box, pick, h("button", {class:"btn ghost small jump", type:"button", onclick: () => go(f.of)}, `「${tt}」を開く →`));
  return wrap;
}

/* 基本情報の日付から選ぶ（複数選択） */
function datesEl(f, obj, onChange){
  const wrap = h("div", {class:"f " + (f.w || "")}), box = h("div", {class:"chips"});
  const cur = () => (obj[f.k] = Array.isArray(obj[f.k]) ? obj[f.k] : []);
  const fd = festivalDates();
  const changed = () => { cur().sort((a, b) => dkey(a) - dkey(b)); onChange && onChange(f); save(); draw(); };
  const addIn = h("input", {type:"text", placeholder:"例 11/4", "aria-label":"日付を追加"});
  const add = () => { const v = addIn.value.trim(); if (v && !cur().includes(v)) { cur().push(v); addIn.value = ""; changed(); } };
  addIn.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); add(); } };
  function draw(){
    box.textContent = "";
    [...new Set([...fd, ...cur()])].sort((a, b) => dkey(a) - dkey(b)).forEach(d => {
      const on = cur().includes(d), odd = !fd.includes(d);
      box.append(h("button", {type:"button", class:"chip" + (on ? " on" : "") + (odd ? " odd" : ""), "aria-pressed":String(on), title: odd ? "基本情報の日付にない日付です" : "",
        onclick: () => { const c = cur(); on ? c.splice(c.indexOf(d), 1) : c.push(d); changed(); }}, d));
    });
    if (!fd.length) box.append(h("span", {class:"hint"}, "先に「基本情報」で日付を入れると、ここから選べます。"));
  }
  draw();
  wrap.append(h("label", {class:"lab"}, f.l), box, h("div", {class:"addrow"}, addIn, h("button", {class:"btn small", type:"button", onclick: add}, "日付を追加")));
  return wrap;
}

/* ============ 描画 ============ */
function renderNav(){
  const nav = document.getElementById("nav"); nav.textContent = "";
  let g = null;
  for (const s of SECTIONS) {
    if (s.group !== g) { g = s.group; nav.append(h("div", {class:"grp"}, g)); }
    nav.append(h("button", {type:"button", class: s.id === cur ? "on" : "", onclick: () => go(s.id)}, h("span", {}, s.title), h("span", {class:"cnt", id:"cnt-" + s.id}, countText(s))));
  }
}
function countText(s){
  if (s.type === "check") { const n = runChecks().length; return n ? n + "件" : "OK"; }
  const d = sec(s.id);
  if (s.type === "form") { const n = s.fields.filter(f => { const v = d.values[f.k]; return v !== undefined && v !== "" && v !== false; }).length; return n + "/" + s.fields.length; }
  if (s.type === "tasks") return d.items.filter(i => i.done).length + "/" + d.items.length;
  const fin = d.items.filter(i => i.status === "確定").length;
  return d.items.length ? fin + "/" + d.items.length : "0";
}
function refreshCounts(){ for (const s of SECTIONS) { const e = document.getElementById("cnt-" + s.id); if (e) { e.textContent = countText(s); e.classList.toggle("bad", s.type === "check" && e.textContent !== "OK"); } } }
function go(id){ cur = id; query = ""; filterMode = "all"; storeCur(); render(); window.scrollTo({top:0}); }

function applyRO(){
  if (!ro) return;
  const m = document.getElementById("main");
  m.querySelectorAll("input,textarea,select").forEach(el => { if (!el.closest(".toolbar")) el.disabled = true; });
  m.querySelectorAll("button").forEach(b => { if (b.classList.contains("jump") || b.closest(".issue") || (b.closest(".toolbar") && b.classList.contains("ghost"))) return; b.disabled = true; });
}
function render(){
  renderNav();
  const main = document.getElementById("main"); main.textContent = "";
  if (!ready) { main.append(h("div", {class:"empty-msg", id:"loading"}, loadMsg)); return; }
  const s = secById(cur), d = sec(cur);
  main.append(h("div", {class:"syncnote", id:"syncnote", hidden:true}, "他の人が更新しました。入力欄から離れると、画面に反映されます。"));
  if (ro) main.append(h("div", {class:"syncnote ro"}, "保存できない状態です。入力しても保存されません。ページを開き直しても直らない場合は、管理者に伝えてください。"));
  main.append(h("div", {class:"warn"}, "パスワード・APIキー・秘密の値は書かないでください。このメモは、共有された全員が見られます。"));
  main.append(h("h2", {class:"sec"}, s.title), h("p", {class:"desc"}, s.desc));
  main.append(h("div", {class:"noteArea"}, h("label", {class:"lab"}, "この項目のメモ・気になること"), h("textarea", {value:d.note || "", placeholder:"自由に書ける欄", oninput: e => { d.note = e.target.value; save(); }})));
  if (s.type === "form") renderForm(s, d, main);
  else if (s.type === "tasks") renderTasks(s, d, main);
  else if (s.type === "check") renderCheck(s, main);
  else renderList(s, d, main);
  if (s.type === "form") main.append(byEl(d));
  applyRO();
}
let loadMsg = "共有データを読み込んでいます…";
/* 「最後に更新した人」（ログインのときに入れた名前）を表示する */
function byEl(rec){
  const el = h("div", {class:"by"});
  if (rec && (rec._by || rec._at)) {
    const when = rec._at ? new Date(rec._at).toLocaleString("ja-JP", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
    el.textContent = "最終更新：" + (rec._by || "だれか") + "　" + when;
  }
  return el;
}

function renderForm(s, d, main){
  const grid = h("div", {class:"grid"});
  for (const f of s.fields) grid.append(fieldEl(f, d.values, refreshCounts));
  main.append(h("div", {class:"card pad"}, grid));
}

function renderList(s, d, main){
  const tb = h("div", {class:"toolbar"},
    h("button", {class:"btn red", type:"button", onclick: () => { const it = {id:uid(), status:"未定", ord:d.items.length}; d.items.push(it); open.add(it.id); filterMode = "all"; query = ""; save(); render(); }}, "＋ 追加"),
    h("select", {class:"btn", onchange: e => { filterMode = e.target.value; drawItems(); }, "aria-label":"表示"},
      [["all","すべて"],["todo","未確定のみ"],["fin","確定のみ"]].map(([v,t]) => h("option", {value:v, selected: filterMode === v}, t))),
    h("input", {type:"search", placeholder:"検索", value:query, oninput: e => { query = e.target.value; drawItems(); }}),
    h("button", {class:"btn ghost small", type:"button", onclick: () => { d.items.forEach(i => open.add(i.id)); drawItems(); }}, "すべて開く"),
    h("button", {class:"btn ghost small", type:"button", onclick: () => { open.clear(); drawItems(); }}, "すべて閉じる"));
  main.append(tb);
  const box = h("div", {id:"items"}); main.append(box);
  function drawItems(){
    box.textContent = "";
    const q = query.trim().toLowerCase();
    let shown = 0;
    d.items.forEach((it, idx) => {
      if (filterMode === "todo" && it.status === "確定") return;
      if (filterMode === "fin" && it.status !== "確定") return;
      if (q && ![...s.fields.map(f => valText(f, it[f.k])), it.src, it.memo].join(" ").toLowerCase().includes(q)) return;
      shown++; box.append(itemCard(s, d, it, idx));
    });
    if (!shown) box.append(h("div", {class:"empty-msg"}, d.items.length ? "条件に合うものがありません" : "まだありません。「＋ 追加」で入力を始められます。"));
  }
  drawItems();
}

function itemCard(s, d, it, idx){
  const tf = s.fields.find(f => f.title);
  const ttl = h("span", {class:"tt"}), sub = h("span", {class:"sub"}), bd = h("span", {class:"badge"}), dv = h("div");
  const upd = () => {
    dv.textContent = ""; const dl = derived(s, it); if (dl) dv.append(dl);
    const t = tf && it[tf.k]; ttl.textContent = t || "（無題）"; ttl.className = "tt" + (t ? "" : " empty");
    const sf = s.fields.find(f => f !== tf && ["text","date","time"].includes(f.t) && it[f.k]); sub.textContent = sf ? it[sf.k] : "";
    const st = it.status || "未定"; bd.textContent = st; bd.className = "badge s" + Math.max(0, STATUS.indexOf(st));
  };
  const card = h("div", {class:"card item" + (open.has(it.id) ? " open" : ""), "data-id": it.id});
  const head = h("div", {class:"head", onclick: () => { card.classList.toggle("open"); card.classList.contains("open") ? open.add(it.id) : open.delete(it.id); }},
    h("span", {class:"chev"}, "▸"), h("span", {class:"no"}, String(idx + 1)), ttl, sub, bd);
  const grid = h("div", {class:"grid"});
  for (const f of s.fields) grid.append(fieldEl(f, it, () => { upd(); refreshCounts(); }));
  const common = h("div", {class:"grid", style:"margin-top:10px"},
    fieldEl(F("status","状態","select",{o:STATUS,w:"w3"}), it, () => { upd(); refreshCounts(); }),
    fieldEl(F("src","確認先・出典（誰に聞く／どの資料）","text",{w:"w4"}), it),
    fieldEl(F("memo","備考","area"), it));
  const tools = h("div", {class:"tools"},
    h("button", {class:"btn small", type:"button", onclick: () => move(d, idx, -1)}, "↑"),
    h("button", {class:"btn small", type:"button", onclick: () => move(d, idx, 1)}, "↓"),
    h("button", {class:"btn small", type:"button", onclick: () => { const c = JSON.parse(JSON.stringify(it)); delete c._by; delete c._at; c.id = uid(); d.items.splice(idx + 1, 0, c); d.items.forEach((x, k) => { x.ord = k; }); open.add(c.id); save(); render(); toast("複製しました"); }}, "複製"),
    h("button", {class:"btn small", type:"button", onclick: async () => {
      const used = usedBy(s.id, it.id).map(u => `${secById(u.sec).title} ${u.n}件`).join("、");
      const warn = used ? `\n\nこの項目は、${used}で選ばれています。削除すると、その部分は「削除された項目」になります。` : "";
      if (await ask("この1件を削除します。元に戻せません。共有しているみんなの画面からも消えます。" + warn, "削除する", true)) { d.items.splice(idx, 1); open.delete(it.id); save(); render(); }
    }}, "削除"));
  card.append(head, h("div", {class:"body"}, grid, dv, common, tools, byEl(it)));
  upd(); return card;
}
function move(d, i, dir){ const j = i + dir; if (j < 0 || j >= d.items.length) return; [d.items[i], d.items[j]] = [d.items[j], d.items[i]]; d.items.forEach((x, k) => { x.ord = k; }); save(); render(); }

function renderTasks(s, d, main){
  const total = d.items.length, done = d.items.filter(i => i.done).length;
  const lab = h("div", {class:"lab"}, `進み具合　${done} / ${total}`);
  const bar = h("i", {style:`width:${total ? done / total * 100 : 0}%`});
  main.append(h("div", {}, lab, h("div", {class:"bar"}, bar)));
  const upBar = () => { const dn = d.items.filter(i => i.done).length; bar.style.width = (d.items.length ? dn / d.items.length * 100 : 0) + "%"; lab.textContent = `進み具合　${dn} / ${d.items.length}`; refreshCounts(); };
  const groups = [...new Set(d.items.map(i => i.g || "その他"))];
  for (const g of groups) {
    const card = h("div", {class:"card pad"}, h("div", {class:"grptitle"}, g));
    d.items.filter(i => (i.g || "その他") === g).forEach(it => {
      const row = h("div", {class:"task" + (it.done ? " done" : "")},
        h("input", {type:"checkbox", checked: it.done, "aria-label":"完了", onchange: e => { it.done = e.target.checked; row.classList.toggle("done", it.done); upBar(); save(); }}),
        h("div", {style:"flex:1;min-width:0"}, h("input", {type:"text", value: it.text, oninput: e => { it.text = e.target.value; save(); }}), it.path ? h("span", {class:"path"}, it.path) : null),
        h("button", {class:"btn small ghost", type:"button", "aria-label":"削除", onclick: async () => { if (await ask("この項目を削除しますか？\n共有しているみんなの画面からも消えます。", "削除する", true)) { d.items.splice(d.items.indexOf(it), 1); save(); render(); } }}, "削除"));
      card.append(row);
    });
    card.append(h("div", {style:"margin-top:8px"}, h("button", {class:"btn small", type:"button", onclick: () => { d.items.splice(d.items.map(i => i.g || "その他").lastIndexOf(g) + 1, 0, {id:uid(), g, text:"", path:"", done:false}); save(); render(); }}, "＋ この分類に追加")));
    main.append(card);
  }
  main.append(h("button", {class:"btn", type:"button", onclick: async () => { const g = await askText("新しい分類の名前"); if (g) { d.items.push({id:uid(), g, text:"", path:"", done:false}); save(); render(); } }}, "＋ 分類を追加"));
}

/* 登録済みの内容から自動で出す参考情報（編集はできない） */
function derived(s, it){
  const L = [];
  const dtxt = x => valText({t:"dates"}, x.dates || x.date) || "日付未選択";
  if (s.id === "films") {
    const sc = items("screenings").filter(x => (x.films || []).includes(it.id));
    L.push("上映される回：" + (sc.length ? sc.map(x => `${titleOf("screenings", x)}（${dtxt(x)}）`).join("、") : "まだ、どの上映回にも入っていません"));
  }
  if (s.id === "venues") {
    const n = sid => items(sid).filter(x => x.venue === it.id).length;
    L.push(`この会場を使っているもの：上映 ${n("screenings")}件／ステージ ${n("stage")}件／ワークショップ ${n("workshops")}件／フード・物販 ${n("food")}件`);
  }
  if (s.id === "screenings") {
    const fl = (it.films || []).map(id => byId("films", id)).filter(Boolean);
    if (fl.length) {
      const known = fl.map(minutesOf).filter(x => x != null), miss = fl.length - known.length;
      L.push(`収録作品の合計：${known.reduce((a, b) => a + b, 0)}分${miss ? `（上映時間が未入力の作品が${miss}本あります）` : ""}`);
    }
    const fr = frameOf(it); if (fr != null) L.push(`この回の枠（開始〜終了）：${fr}分`);
  }
  if (s.id === "awards") {
    const fl = byId("films", it.film);
    if (fl) L.push("作品の情報：" + ([fl.directors, fl.country, fl.min].filter(Boolean).join(" ／ ") || "監督・国・上映時間が、まだ「作品」に入っていません"));
  }
  return L.length ? h("div", {class:"derived"}, L.map(x => h("div", {}, x))) : null;
}

/* 抜け・食い違いチェック */
function runChecks(){
  const out = [], add = (sid, id, msg) => out.push({sid, id, msg});
  const fd = festivalDates(), scs = items("screenings"), films = items("films");
  const ttl = (sid, it) => `「${titleOf(sid, it)}」`;
  const bad = (ids, sid) => (ids || []).some(id => !byId(sid, id));
  // 名前が空・重複
  for (const s of SECTIONS) { if (s.type !== "list" || s.id === "log") continue; const k = tfKey(s.id), seen = {};
    items(s.id).forEach(it => { const v = (it[k] || "").trim();
      if (!v) add(s.id, it.id, `${s.title}：名前が未入力の項目があります`);
      else if (["films", "venues"].includes(s.id)) { if (seen[v]) add(s.id, it.id, `${s.title}：「${v}」が重複しています`); seen[v] = 1; } }); }
  if (!fd.length) add("basic", null, "基本情報：アプリの日付（会期の日付）が未入力です。日付を選ぶ欄が使えません");
  // 作品
  films.forEach(f => { if (!scs.some(s => (s.films || []).includes(f.id))) add("films", f.id, `作品：${ttl("films", f)}は、どの上映回にも入っていません`); });
  // 上映回
  scs.forEach(s => {
    const n = ttl("screenings", s), fl = s.films || [];
    if (!fl.length) add("screenings", s.id, `上映：${n}に収録作品が選ばれていません`);
    if (bad(fl, "films")) add("screenings", s.id, `上映：${n}に、削除された作品が入っています`);
    if (new Set(fl).size !== fl.length) add("screenings", s.id, `上映：${n}に同じ作品が2回入っています`);
    if (!s.venue) add("screenings", s.id, `上映：${n}の会場が未選択です`);
    else if (!byId("venues", s.venue)) add("screenings", s.id, `上映：${n}の会場が削除されています`);
    if (!(s.dates || []).length) add("screenings", s.id, `上映：${n}の上映日が未選択です`);
    else if (fd.length && s.dates.some(d => !fd.includes(d))) add("screenings", s.id, `上映：${n}に、基本情報の日付にない日があります`);
    if (!s.start) add("screenings", s.id, `上映：${n}の開始時刻が未入力です`);
    else if (s.end && toMin(s.end) <= toMin(s.start)) add("screenings", s.id, `上映：${n}の終了が開始より前（または同じ）です`);
    const fr = frameOf(s), fs = fl.map(id => byId("films", id)).filter(Boolean).map(minutesOf);
    if (fr != null && fs.length && fs.every(x => x != null) && fs.reduce((a, b) => a + b, 0) > fr) add("screenings", s.id, `上映：${n}は、収録作品の合計時間が枠（開始〜終了）を超えています`);
  });
  // 同じ会場・同じ日で時間が重なる上映
  for (let i = 0; i < scs.length; i++) for (let j = i + 1; j < scs.length; j++) {
    const a = scs[i], b = scs[j];
    if (!a.venue || a.venue !== b.venue || !(a.dates || []).some(d => (b.dates || []).includes(d))) continue;
    const a1 = toMin(a.start), a2 = toMin(a.end), b1 = toMin(b.start), b2 = toMin(b.end);
    if ([a1, a2, b1, b2].some(x => x == null)) continue;
    if (a1 < b2 && b1 < a2) add("screenings", a.id, `上映：${ttl("screenings", a)}と${ttl("screenings", b)}が、同じ会場・同じ日で時間が重なっています`);
  }
  // ステージ・ワークショップ・フード
  for (const sid of ["stage", "workshops", "food"]) { const sn = secById(sid).title, k = sid === "food" ? "dates" : "date";
    items(sid).forEach(it => { const n = ttl(sid, it);
      if (!(it[k] || []).length) add(sid, it.id, `${sn}：${n}の日付が未選択です`);
      else if (fd.length && it[k].some(d => !fd.includes(d))) add(sid, it.id, `${sn}：${n}に、基本情報の日付にない日があります`);
      if (it.venue && !byId("venues", it.venue)) add(sid, it.id, `${sn}：${n}の会場が削除されています`);
      else if (!it.venue) add(sid, it.id, `${sn}：${n}の会場が未選択です`); }); }
  // 会場
  const pins = {};
  items("venues").forEach(v => { const p = (v.pin || "").trim().toUpperCase(); if (!p) return; if (pins[p]) add("venues", v.id, `会場：マップ記号「${p}」が重複しています（${ttl("venues", pins[p])}と${ttl("venues", v)}）`); else pins[p] = v; });
  // 受賞
  items("awards").forEach(a => { if (!a.film) add("awards", a.id, `受賞作品：${ttl("awards", a)}の作品が未選択です`); else if (!byId("films", a.film)) add("awards", a.id, `受賞作品：${ttl("awards", a)}の作品が削除されています`); });
  // スポンサー
  items("sponsors").forEach(p => { if (p.pub && !p.logo) add("sponsors", p.id, `スポンサー：${ttl("sponsors", p)}は公開にしてありますが、ロゴのファイル名が未入力です`); });
  // 基本情報
  const b = sec("basic").values;
  if (b.dateStart && b.dateEnd && b.dateStart > b.dateEnd) add("basic", null, "基本情報：会期の開始日が、終了日より後になっています");
  return out;
}

  const groups = {};
  issues.forEach(i => (groups[i.sid] = groups[i.sid] || []).push(i));
  for (const sid in groups) {

    groups[sid].forEach(i => card.append(h("div", {class:"issue"}, h("span", {}, i.msg), h("button", {class:"btn small", type:"button", onclick: () => jump(i.sid, i.id)}, "開く"))));

  for (const x of SECTIONS.filter(x => x.type === "list" && x.id !== "log")) {

  }

}

/* ============ 書き出し・読み込み ============ */
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); };
function valText(f, v){
  if (f.t === "check") return v ? "はい" : "";
  if (f.t === "ref") return v ? (byId(f.of, v) ? titleOf(f.of, byId(f.of, v)) : "（削除済み）") : "";
  if (f.t === "refs") return (Array.isArray(v) ? v : []).map(id => byId(f.of, id) ? titleOf(f.of, byId(f.of, id)) : "（削除済み）").join("\n");
  if (f.t === "dates") return (Array.isArray(v) ? v : []).join("、");
  return v == null ? "" : String(v);
}
const bullet = (l, v) => `- ${l}：${v.includes("\n") ? "\n" + v.split("\n").map(x => "  " + x).join("\n") : v}`;

function toMarkdown(){
  const out = ["# キネコ 来年度アプリ更新メモ", "", `書き出し日：${new Date().toLocaleString("ja-JP")}`, ""];
  for (const s of SECTIONS) {
    const d = sec(s.id);
    out.push(`## ${s.title}`, "");
    if (d.note && d.note.trim()) out.push(d.note.trim(), "");
    if (s.type === "form") {
      for (const f of s.fields) { const v = valText(f, d.values[f.k]); if (v) out.push(bullet(f.l, v)); }
    } else if (s.type === "check") {
      const is = runChecks();
      out.push(...(is.length ? is.map(i => `- ${i.msg}`) : ["- 問題は見つかっていません"]));
    } else if (s.type === "tasks") {
      let g = null;
      for (const it of d.items) { if ((it.g || "その他") !== g) { g = it.g || "その他"; out.push("", `### ${g}`); } out.push(`- [${it.done ? "x" : " "}] ${it.text}${it.path ? `（${it.path}）` : ""}`); }
    } else {
      const tf = s.fields.find(f => f.title);
      d.items.forEach((it, i) => {
        out.push(`### ${i + 1}. ${(tf && it[tf.k]) || "（無題）"}　［${it.status || "未定"}］`);
        for (const f of s.fields) { if (f === tf) continue; const v = valText(f, it[f.k]); if (v) out.push(bullet(f.l, v)); }
        if (it.src) out.push(`- 確認先・出典：${it.src}`);
        if (it.memo) out.push(bullet("備考", it.memo));
        out.push("");
      });
      if (!d.items.length) out.push("（未入力）");
    }
    out.push("");
  }
  return out.join("\n");
}
function toCsv(s){
  const d = sec(s.id);
  const esc = v => { let t = v == null ? "" : String(v); if (/^[=+\-@]/.test(t)) t = "'" + t; return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  let rows;
  if (s.type === "form") rows = [["項目", "内容"], ...s.fields.map(f => [f.l, valText(f, d.values[f.k])])];
  else if (s.type === "check") rows = [["項目", "内容"], ...runChecks().map(i => [secById(i.sid).title, i.msg])];
  else if (s.type === "tasks") rows = [["分類", "やること", "場所", "完了"], ...d.items.map(i => [i.g, i.text, i.path, i.done ? "完了" : ""])];
  else rows = [[...s.fields.map(f => f.l), "状態", "確認先・出典", "備考"], ...d.items.map(i => [...s.fields.map(f => valText(f, i[f.k])), i.status, i.src, i.memo])];
  return "﻿" + rows.map(r => r.map(esc).join(",")).join("\r\n");
}
function saveFile(name, text){
  try {
    const a = h("a", {href: URL.createObjectURL(new Blob([text], {type:"text/plain;charset=utf-8"})), download:name});

    toast("ダウンロードしました");

}
function doExport(kind){
  if (!ready) { toast("読み込みが終わってから、もう一度押してください"); return; }

  if (kind === "md") saveFile(`kineko-notes-${stamp()}.md`, toMarkdown());
  if (kind === "csv") { const s = secById(cur); saveFile(`kineko-${s.id}-${stamp()}.csv`, toCsv(s)); }

/* ============ 保存先：Supabase（kineko-notesの表 app_notes_*）。パスワードの確認は、サーバー側の関数で行う ============
   このファイルの SUPABASE_URL / SUPABASE_ANON_KEY は、公開してよい値（anon key は、表を直接読めない設定になっている）。
   メモの中身は、パスワードを知っている人だけが、関数 app_notes_list / app_notes_write 経由で読み書きできる。 */
const SUPABASE_URL = "https://pmrbrguwgdnthanxqizz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xFpk341agD2xhRkgIeiWyA_mJ3tCAOu";
const POLL_MS = 4000;

/* 共有データベースと同じ形（collection().onSnapshot / doc().set・update・delete）に見せる。変更は、数秒おきの取得で受け取る */
function makeRemoteDb(pw, by, onAuthFail){
  const H = {apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json"};
  async function rpc(fn, body){
    let r;
    try { r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {method:"POST", headers:H, body:JSON.stringify(body)}); }
    catch (e) { throw {code:"unavailable"}; }
    if (!r.ok) throw {code: r.status === 429 ? "resource_exhausted" : "unavailable", status:r.status};
    return r.json();
  }
  const known = new Map(), listeners = [];
  let since = null, inflight = false, started = false, dead = false, failing = 0;
  const mk = (id, data) => ({id, exists:true, data: () => clone(data), metadata:{fromCache:false, hasPendingWrites:false}});
  async function poll(){
    if (inflight || dead) return; inflight = true;
    try {
      const res = await rpc("app_notes_list", {p_password:pw, p_since:since});
      failing = 0;
      if (!res.ok) { dead = true; onAuthFail(res.error); return; }
      const ch = {sec:[], rec:[]};
      for (const d of res.docs) {
        const i = d.id.indexOf("/"), coll = d.id.slice(0, i), id = d.id.slice(i + 1), had = known.has(d.id);
        if (!ch[coll]) continue;
        if (d.deleted) { if (had) { ch[coll].push({type:"removed", doc:mk(id, known.get(d.id))}); known.delete(d.id); } continue; }
        if (!had) { known.set(d.id, d.data); ch[coll].push({type:"added", doc:mk(id, d.data)}); }
        else if (JSON.stringify(known.get(d.id)) !== JSON.stringify(d.data)) { known.set(d.id, d.data); ch[coll].push({type:"modified", doc:mk(id, d.data)}); }
      }
      // 同時に書かれた変更を取りこぼさないよう、少し前から取り直す（同じ内容は無視される）
      if (res.latest) since = new Date(new Date(res.latest).getTime() - 3000).toISOString();
      for (const l of listeners) if (ch[l.c].length || !l.done) { l.done = true; l.cb({docChanges: () => ch[l.c], metadata:{fromCache:false, hasPendingWrites:false}}); }
      if (lastWriteOk && ready) setSaveState("同期済み " + clock());
    } catch (e) {
      failing++;
      if (ready) setSaveState("通信できません。つながり次第、自動で再開します", true);
      else if (failing >= 3) { loadMsg = "共有データに接続できません。通信状況を確認してください。つながり次第、自動で再開します。"; const l = document.getElementById("loading"); if (l) l.textContent = loadMsg; }
    } finally { inflight = false; }
  }
  const tick = async () => { await poll(); if (!dead) setTimeout(tick, document.hidden ? 15000 : POLL_MS); };
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  async function write(path, op, data){
    const res = await rpc("app_notes_write", {p_password:pw, p_ops:[{id:path, op, data: data || {}}], p_by:by});
    if (!res.ok) { dead = true; onAuthFail(res.error); throw {code:"unavailable"}; }
    const r = res.results[0];
    if (r.error === "not_found") throw {code:"invalid_argument"};          // 更新のつもりが、相手が消えていた → ページ側が、作り直す
    if (r.error === "quota_exceeded") throw {code:"quota_exceeded"};
    if (r.error) throw {code:"resource_exhausted"};
    setTimeout(poll, 150);                                                   // 自分の書き込みも、すぐ取り込む
  }
  return {
    collection: c => ({ onSnapshot: (cb, err) => { listeners.push({c, cb, err, done:false}); if (!started) { started = true; setTimeout(tick, 0); } return () => {}; } }),
    doc: path => ({ set: d => write(path, "set", d), update: d => write(path, "update", d), delete: () => write(path, "delete") }),
    poll
  };
}

/* ログイン（名前とパスワード）。名前は、「最後に更新した人」の表示に使う */
const LOGIN_KEY = "kineko-notes-login";
function readLogin(){ for (const st of [() => localStorage, () => sessionStorage]) { try { const v = JSON.parse(st().getItem(LOGIN_KEY) || "null"); if (v && v.name && v.pw) return v; } catch(e){} } return null; }
function writeLogin(v, remember){ try { localStorage.removeItem(LOGIN_KEY); sessionStorage.removeItem(LOGIN_KEY); (remember ? localStorage : sessionStorage).setItem(LOGIN_KEY, JSON.stringify(v)); } catch(e){} }
function clearLogin(){ try { localStorage.removeItem(LOGIN_KEY); sessionStorage.removeItem(LOGIN_KEY); } catch(e){} }
let lastName = ""; try { lastName = localStorage.getItem("kineko-notes-name") || ""; } catch(e){}

function showLogin(msg){
  document.body.classList.add("out");
  const main = document.getElementById("main"); main.textContent = "";
  const nm = h("input", {type:"text", id:"lg-name", value:lastName, autocomplete:"name", placeholder:"例：米沢"});
  const pwd = h("input", {type:"password", id:"lg-pw", autocomplete:"current-password"});
  const rem = h("input", {type:"checkbox", id:"lg-rem", checked:true});
  const err = h("div", {class:"err", role:"alert"}, msg || "");
  const btn = h("button", {class:"btn red", type:"submit"}, "入る");
  const go = async e => {
    e.preventDefault();
    const name = nm.value.trim(), pw = pwd.value;
    if (!name || !pw) { err.textContent = "お名前とパスワードを入れてください"; return; }
    btn.disabled = true; err.textContent = "確認しています…";
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/app_notes_list`, {method:"POST", headers:{apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json"}, body:JSON.stringify({p_password:pw, p_since:null})});
      if (!res.ok) throw new Error("net");
      const j = await res.json();
      if (!j.ok) { err.textContent = j.error === "locked" ? "間違いが続いたため、しばらく受け付けられません。10分ほどあとに、もう一度お試しください" : "パスワードが違います"; btn.disabled = false; return; }
      try { localStorage.setItem("kineko-notes-name", name); } catch(e){}
      writeLogin({name, pw}, rem.checked);
      startSession(name, pw);
    } catch (e2) { err.textContent = "つながりませんでした。通信状況を確認して、もう一度お試しください"; btn.disabled = false; }
  };
  main.append(h("form", {class:"login", onsubmit:go},
    h("h2", {}, "キネコ 来年度アプリ更新メモ"),
    h("p", {}, "共有メモです。教えてもらったパスワードを入れてください。お名前は、「最後に更新した人」として表示されます。"),
    h("label", {class:"lab", for:"lg-name"}, "お名前"), nm,
    h("label", {class:"lab", for:"lg-pw"}, "パスワード"), pwd,
    h("label", {class:"rem", for:"lg-rem"}, rem, "この端末では、次回から入力しない"),
    btn, err));
  nm.value ? pwd.focus() : nm.focus();
}
function startSession(name, pw){
  document.body.classList.remove("out");
  myName = name;
  document.getElementById("who").textContent = name + " さん";
  db = makeRemoteDb(pw, name, why => {
    clearLogin();
    showLogin(why === "locked" ? "間違いが続いたため、しばらく受け付けられません" : "パスワードが変わりました。新しいパスワードを入れてください");
  });
  render();
  setSaveState("接続中…");
  const err = e => { loadMsg = "共有データを読み込めませんでした（" + ((e && e.code) || "エラー") + "）"; if (!ready) render(); };
  db.collection("sec").onSnapshot(s => onSnap("sec", s), err);
  db.collection("rec").onSnapshot(s => onSnap("rec", s), err);
}
document.getElementById("logoutBtn").onclick = () => { clearLogin(); location.reload(); };
function boot(){
  if (SUPABASE_URL.startsWith("__") || SUPABASE_ANON_KEY.startsWith("__")) { document.body.classList.add("out"); document.getElementById("main").append(h("div", {class:"login"}, h("h2", {}, "設定が終わっていません"), h("p", {}, "接続先（SUPABASE_URL / SUPABASE_ANON_KEY）が入っていません。"))); return; }
  const saved = readLogin();
  if (saved) startSession(saved.name, saved.pw); else showLogin("");
}
boot();
